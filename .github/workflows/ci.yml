name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: frontend-install
        run: pnpm install --frozen-lockfile
      - name: frontend-format-check
        run: pnpm format:check
      - name: frontend-lint
        run: pnpm lint
      - name: frontend-typecheck
        run: pnpm -r typecheck
      - name: frontend-unit-test
        run: pnpm test:unit
      - name: frontend-build
        run: pnpm build

  backend-and-contracts:
    name: Backend and contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.11"
          enable-cache: true
      - name: frontend-install-for-contract-generator
        run: pnpm install --frozen-lockfile
      - name: backend-sync
        run: uv sync --project services/api --locked
      - name: backend-lint
        run: pnpm backend:lint
      - name: backend-format-check
        run: pnpm backend:format:check
      - name: backend-typecheck
        run: pnpm backend:typecheck
      - name: backend-unit-test
        run: pnpm backend:test
      - name: extractor-pydantic-roundtrip
        run: pnpm test:contract-roundtrip
      - name: openapi-contract-check
        run: pnpm contracts:check

  playwright-webkit-smoke:
    name: Playwright WebKit smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.11"
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm backend:sync
      - run: pnpm build
      - run: pnpm playwright:install:ci
      - run: pnpm test:e2e
