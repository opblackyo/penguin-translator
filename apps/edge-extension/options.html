<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Penguin Translator Dev Options</title>
    <style>
      body { max-width: 680px; margin: 32px auto; padding: 0 20px; font: 16px/1.5 system-ui; color: #0f172a; }
      form { display: grid; gap: 16px; }
      label { display: grid; gap: 6px; font-weight: 600; }
      input, select, button { box-sizing: border-box; width: 100%; padding: 9px; font: inherit; }
      button { width: max-content; border: 0; border-radius: 6px; background: #0f172a; color: white; }
      .notice { padding: 12px; border-radius: 6px; background: #fff7ed; }
      #status { min-height: 1.5em; }
    </style>
  </head>
  <body>
    <h1>企鵝翻譯機 — Private Dev</h1>
    <p class="notice">僅供本機私人開發。Token 儲存在 chrome.storage.local，不會寫入 bundle。</p>
    <form id="options-form">
      <label>API Endpoint <input id="api-endpoint" type="url" required placeholder="Local API origin" /></label>
      <label>Local API Token <input id="local-token" type="password" required autocomplete="off" /></label>
      <label>Target Language
        <select id="target-language"><option value="zh-Hant">Traditional Chinese (zh-Hant)</option></select>
      </label>
      <button type="submit">Save private settings</button>
      <output id="status"></output>
    </form>
    <script src="options.js"></script>
  </body>
</html>
