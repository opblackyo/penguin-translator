[project]
name = "penguin-translator-api"
version = "0.1.0"
description = "M0-compatible API with an M1 OCR translation vertical slice"
readme = "../../README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.139.0",
    "google-genai>=1.0.0",
    "httpx>=0.28.1",
    "pillow>=12.1.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.13.1",
    "uvicorn[standard]>=0.51.0",
]

[project.optional-dependencies]
ocr = [
    "paddleocr>=3.7.0",
    "paddlepaddle>=3.2.0",
]
ocr-vl-spike = [
    "paddleocr>=3.7.0",
    "paddlepaddle>=3.2.0",
    "paddlex[ocr]>=3.7.2",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "penguin_translator_api"
module-root = "src"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
